<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0F172A" />
    <title>Mes tournées et positions</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #f8f9fb; font-family: 'Inter', system-ui, sans-serif; margin: 0; padding-bottom: 40px; }
        
        /* En-tête avec un léger fond bleu marine */
        .header-container { position: sticky; top: 0; z-index: 10; background: #0F172A; padding: 16px; display: flex; align-items: center; gap: 12px; color: white; }
        .header-container h1 { font-size: 18px; margin: 0; flex: 1; font-weight: 600; }
        .back-btn-modern { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.1); color: white; text-decoration: none; font-size: 18px; transition: background 0.2s; }
        .back-btn-modern:active { background: rgba(255,255,255,0.2); }
        
        .content-wrap { padding: 16px; max-width: 800px; margin: 0 auto; }
        .subtitle { color: #64748b; font-size: 13px; margin-bottom: 20px; }
        
        .actions-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-action { border: none; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .btn-primary { background: #0066ff; color: white; box-shadow: 0 4px 10px rgba(0,102,255,0.2); }
        .btn-secondary { background: #e2e8f0; color: #0F172A; }
        
        /* Cartes avec bordure colorée à gauche */
        .tournee-card { background: white; border: 1px solid #e2e8f0; border-left: 4px solid #0066ff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        
        .tournee-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #e2e8f0; padding-bottom: 10px; margin-bottom: 12px; }
        .tournee-date { font-size: 15px; font-weight: 700; color: #0F172A; }
        .tournee-time { font-size: 13px; color: #64748b; font-weight: 500; }
        
        /* Badge "En cours" */
        .badge-encours { background: #fef3c7; color: #b45309; font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 700; }
        
        /* Boîtes GPS colorées */
        .tournee-body { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .gps-box { padding: 10px; border-radius: 8px; }
        .gps-box.depart { background: #ecfdf5; border: 1px solid #d1fae5; }
        .gps-box.arrivee { background: #fff7ed; border: 1px solid #ffedd5; }
        
        .gps-label { font-size: 10px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
        .gps-box.depart .gps-label { color: #047857; }
        .gps-box.arrivee .gps-label { color: #c2410c; }
        
        .gps-value { font-family: monospace; font-size: 12px; font-weight: 600; color: #1e293b; word-break: break-all; }
        .gps-value.missing { color: #94a3b8; font-style: italic; font-family: 'Inter', sans-serif; font-weight: 400; }
        
        .mention { font-size: 11px; color: #94a3b8; margin-top: 30px; text-align: center; line-height: 1.5; }
        .empty-state { text-align: center; color: #64748b; padding: 40px 20px; background: white; border-radius: 12px; border: 1px solid #e2e8f0; }

        @media print {
            .header-container, .actions-row { display: none; }
            body { background: white; }
            .tournee-card { border-left: none; box-shadow: none; padding: 0 0 15px 0; border-bottom: 1px solid #ccc; border-radius: 0; margin-bottom: 15px; }
            .gps-box { border: 1px solid #ccc; background: transparent !important; }
        }
    </style>
</head>
<body>

<div class="header-container">
    <a href="index.html" class="back-btn-modern">←</a>
    <h1>Mes positions GPS</h1>
</div>

<div class="content-wrap">
    <p class="subtitle">Relevé des positions enregistrées au démarrage et à la clôture de chaque tournée.</p>
    
    <div class="actions-row">
        <button class="btn-action btn-primary" onclick="window.print()">📄 Télécharger / PDF</button>
        <button class="btn-action btn-secondary" onclick="partager()">📤 Partager</button>
    </div>

    <div id="liste">
        <div class="empty-state">Chargement des données...</div>
    </div>

    <div class="mention">
        Données enregistrées par l'application Sourougnon Agent.<br>Ce relevé comporte uniquement deux positions ponctuelles (départ et arrivée).
    </div>
</div>

<script>
const API_BASE = 'https://sourougnon.alwaysdata.net';
const token = localStorage.getItem('agent_token');

if (!token) {
    window.location.href = 'login.html';
}

function formatDateHeure(dateStr) {
    if (!dateStr) return '-';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatHeure(dateStr) {
    if (!dateStr) return '-';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '-';
    return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

async function chargerTournees() {
    try {
        const res = await fetch(API_BASE + '/api/agent/tournees', {
            headers: {
                'Authorization': 'Bearer ' + token,
                'Accept': 'application/json'
            }
        });
        if (!res.ok) throw new Error('Erreur ' + res.status);
        const tournees = await res.json();
        const el = document.getElementById('liste');
        
        if (!tournees || tournees.length === 0) {
            el.innerHTML = '<div class="empty-state">Aucune tournée enregistrée pour le moment.</div>';
            return;
        }
        
        let html = '';
        tournees.forEach(t => {
            const dateAffichage = formatDateHeure(t.date_tournee);
            const heureDebut = formatHeure(t.heure_demarrage);
            const heureFin = formatHeure(t.heure_fin);
            
            // Gestion de l'affichage du statut (En cours ou Heure de fin)
            const timeDisplay = t.heure_fin 
                ? `<span class="tournee-time">${heureDebut} - ${heureFin}</span>` 
                : `<span class="tournee-time">${heureDebut}</span> <span class="badge-encours">En cours</span>`;

            // Affichage conditionnel des coordonnées GPS
            const gpsDepartHtml = t.gps_depart 
                ? `<div class="gps-value">${t.gps_depart}</div>` 
                : `<div class="gps-value missing">Non enregistré</div>`;
                
            const gpsArriveeHtml = t.gps_arrivee 
                ? `<div class="gps-value">${t.gps_arrivee}</div>` 
                : `<div class="gps-value missing">Non enregistré</div>`;
            
            html += `
            <div class="tournee-card">
                <div class="tournee-header">
                    <span class="tournee-date">${dateAffichage}</span>
                    ${timeDisplay}
                </div>
                <div class="tournee-body">
                    <div class="gps-box depart">
                        <span class="gps-label">📍 Départ</span>
                        ${gpsDepartHtml}
                    </div>
                    <div class="gps-box arrivee">
                        <span class="gps-label">🏁 Arrivée</span>
                        ${gpsArriveeHtml}
                    </div>
                </div>
            </div>`;
        });
        
        el.innerHTML = html;
    } catch(e) {
        document.getElementById('liste').innerHTML = '<div class="empty-state" style="color: #ef4444;">Erreur de chargement des données.</div>';
    }
}

async function partager() {
    const cartes = document.querySelectorAll('.tournee-card');
    let texte = "Mes positions GPS - Sourougnon\n\n";
    
    cartes.forEach(c => {
        texte += c.innerText + "\n\n";
    });

    if (navigator.share) {
        try {
            await navigator.share({ title: 'Mes positions GPS', text: texte });
        } catch (err) { console.warn('Partage annulé'); }
    } else {
        try {
            await navigator.clipboard.writeText(texte);
            alert('Le relevé a été copié dans les presse-papiers.');
        } catch (e) {
            alert('Le partage natif n\'est pas disponible sur cet appareil.');
        }
    }
}

chargerTournees();
</script>
</body>
</html>
